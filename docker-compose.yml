version: '3.8'

services:
  ats-bot:
    build: .
    container_name: telegram-ats-bot
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-mixtral-8x7b-32768}
      DATABASE_PATH: /app/data/ats_bot.db
      TEMP_DIR: /app/temp_files
    volumes:
      - ./data:/app/data
      - ./temp_files:/app/temp_files
    restart: unless-stopped
    networks:
      - ats-network

networks:
  ats-network:
    driver: bridge
